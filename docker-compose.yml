services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: edge
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - io
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready', '-d', 'edge' ]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  init:
    image: thingsboard/tb-edge:4.3.1EDGE-latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    user: root
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edge
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        MARKER=/data/.tb-edge-installed
        if [ -f "$$MARKER" ]; then
          echo "[init] Schema do Edge já instalado — pulando."
          exit 0
        fi
        echo "[init] Schema ausente — executando install (alguns minutos)..."
        export INSTALL_TB=true
        export LOAD_DEMO=false
        /usr/bin/start-tb-edge.sh
        touch "$$MARKER"
        echo "[init] Install concluído — marker $$MARKER criado."
    volumes:
      - tb_data:/data
      - log_data:/var/log/tb-edge
    networks:
      - io

  edge:
    image: thingsboard/tb-edge:4.3.1EDGE-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "${PORT_WEB}:8080"
      - "${PORT_MQTT}:1883"
      - "5683-5688:5683-5688/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edge
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CLOUD_ROUTING_KEY: ${TB_EDGE_KEY}
      CLOUD_ROUTING_SECRET: ${TB_EDGE_SECRET}
      CLOUD_RPC_HOST: ${TB_SERVER}
      CLOUD_RPC_SSL_ENABLED: "false"
    volumes:
      - tb_data:/data
      - log_data:/var/log/tb-edge
    networks:
      - io

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "${PORT_PGADMIN}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - io

  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    volumes:
      - backup:/backups
    networks:
      - io
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=edge
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    profiles:
      - test
      - production

# Execute:
# docker network create --driver=bridge --subnet=172.30.66.0/24 --gateway=172.30.66.1 io_thingsboard_edge
networks:
  io:
    name: io_thingsboard_edge
    external: true

volumes:
  pg_data:
    name: ${VOLUME_DB}
    external: true

  tb_data:
    name: ${VOLUME_EDGE}
    external: true

  log_data:
    name: ${VOLUME_LOG}
    external: true

  pgadmin_data:
    name: ${VOLUME_PGADMIN}
    external: true

  backup:
    name: ${VOLUME_BACKUP}
    external: true
