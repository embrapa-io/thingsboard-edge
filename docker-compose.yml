services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: edge
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      io:
        aliases:
          - thingsboard-edge-db
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready', '-d', 'edge' ]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  edge:
    image: thingsboard/tb-edge:4.3.1EDGE-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT_WEB}:8080"
      - "${PORT_MQTT}:1883"
      - "${PORT_MQTTS:-9884}:8883"
      # Host range is configurable because the local Central already uses 5683-5688/udp.
      - "${PORT_COAP_START:-6583}-${PORT_COAP_END:-6588}:5683-5688/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # O Edge também participa da rede da Central, onde já existe um service
      # chamado db. Use um alias exclusivo para nunca cruzar os Postgres.
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-edge-db:5432/edge
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CLOUD_ROUTING_KEY: ${TB_EDGE_KEY}
      CLOUD_ROUTING_SECRET: ${TB_EDGE_SECRET}
      CLOUD_RPC_HOST: ${TB_SERVER}
      CLOUD_RPC_SSL_ENABLED: "false"
      # TLS do MQTT de devices é independente do TLS do canal Edge-Central.
      MQTT_ENABLED: "${MQTT_ENABLED:-true}"
      MQTT_BIND_ADDRESS: "${MQTT_BIND_ADDRESS:-0.0.0.0}"
      MQTT_BIND_PORT: "1883"
      MQTT_SSL_ENABLED: "${MQTT_SSL_ENABLED:-true}"
      MQTT_SSL_BIND_ADDRESS: "${MQTT_SSL_BIND_ADDRESS:-0.0.0.0}"
      MQTT_SSL_BIND_PORT: "8883"
      MQTT_SSL_PROTOCOL: "${MQTT_SSL_PROTOCOL:-TLSv1.2}"
      MQTT_SSL_CREDENTIALS_TYPE: "PEM"
      MQTT_SSL_PEM_CERT: "/etc/tb-edge/certs/server.pem"
      MQTT_SSL_PEM_KEY: "/etc/tb-edge/certs/server_key.pem"
    volumes:
      - tb_data:/data
      - log_data:/var/log/tb-edge
      # Defaults point to the local Central development certificate. Deployments
      # must provide an Edge certificate with the public hostname in its SAN.
      - "${MQTT_SSL_CERT_FILE:-../thingsboard/certs/server.pem}:/etc/tb-edge/certs/server.pem:ro"
      - "${MQTT_SSL_KEY_FILE:-../thingsboard/certs/server_key.pem}:/etc/tb-edge/certs/server_key.pem:ro"
    networks:
      - io
      - thingsboard

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "${PORT_PGADMIN}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - io

  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    volumes:
      - backup:/backups
    networks:
      - io
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=edge
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    profiles:
      - test
      - production

# Execute:
# docker network create --driver=bridge --subnet=172.30.66.0/24 --gateway=172.30.66.1 io_thingsboard_edge
networks:
  io:
    name: io_thingsboard_edge
    external: true
  thingsboard:
    # Rede externa da Central; permite RPC interno por service name, sem
    # depender de host.docker.internal ou de resolução IPv6 do host.
    name: io_thingsboard
    external: true

volumes:
  pg_data:
    name: ${VOLUME_DB}
    external: true

  tb_data:
    name: ${VOLUME_EDGE}
    external: true

  log_data:
    name: ${VOLUME_LOG}
    external: true

  pgadmin_data:
    name: ${VOLUME_PGADMIN}
    external: true

  backup:
    name: ${VOLUME_BACKUP}
    external: true
